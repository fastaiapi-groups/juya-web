<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>注册商户 / 代理 · FastAiApi</title><link rel="stylesheet" href="/hub/home/merchant/merchant.css"><link rel="icon" href="/hub/home/assets/favicon.svg" type="image/svg+xml"><script src="/hub/home/merchant/register.js" defer></script></head>
<body><main class="login-layout"><div class="login-story"><a class="brand inverse" href="/hub/home/"><span class="brand-icon">F</span>FastAiApi</a><div><span class="eyebrow">JOIN THE MERCHANT CENTER</span><h1>你的故事，<br>从这里出发。</h1><p>注册商户 / 代理账号，<br>审批通过后，即可按分销权限管理自己的漫剧卡密。</p><div class="story-tags"><span>提交注册</span><span>管理员审批</span><span>开始使用</span></div></div><small>FASTAIAPI · 为每一份创作，连接更多可能</small></div><div class="login-side"><div class="login-card"><span class="eyebrow purple">CREATE YOUR ACCOUNT</span><h2>注册商户 / 代理</h2><p class="muted">商户与各级代理注册后需等待管理员审批。</p><form id="register-form"><label>商户 / 代理名称<input name="display_name" required maxlength="60" autocomplete="organization" placeholder="用于识别你的商户名称"></label><label>登录账号<input name="username" required minlength="3" maxlength="40" autocomplete="username" placeholder="3–40 位字母、数字、_.-"></label><label>登录密码<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password" placeholder="12–128 位"></label><label>确认密码<input name="confirm_password" type="password" required minlength="12" maxlength="128" autocomplete="new-password" placeholder="再次输入密码"></label><p id="register-error" class="error" role="alert"></p><button class="button primary full" type="submit">提交注册申请 <span>→</span></button></form><div id="register-result" class="register-result" role="status" hidden><h3>注册申请已提交</h3><p>请等待管理员审批。审批通过后，即可使用注册账号和密码登录，按分销权限管理自己的卡密。</p><a class="button primary" href="/hub/home/merchant/">返回登录 →</a></div><div class="login-links"><a href="/hub/home/merchant/">已有账号？返回登录</a><a href="/hub/home/">返回官网 ↗</a></div></div></div></main></body></html>
