name: fastai-website
services:
  website:
    build: .
    restart: unless-stopped
    depends_on:
      merchant:
        condition: service_healthy
    networks:
      - default
      - design-pages
      - account-pages
    ports:
      - "${WEBSITE_BIND:-0.0.0.0}:${WEBSITE_PORT:-6660}:80"
    volumes:
      - type: bind
        source: ${DOWNLOADS_DIR:-/opt/fastaiapi-groups/juya-web/download}
        target: /srv/downloads
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config
        target: /etc/fastai
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  merchant:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-development}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-merchant}
      PGDATABASE: ${POSTGRES_DB:-merchant}
      PGPASSWORD: ${POSTGRES_PASSWORD:?请通过 restart.sh 初始化 PostgreSQL 配置}
      MERCHANT_ADMIN_USERNAME: ${MERCHANT_ADMIN_USERNAME:-}
      MERCHANT_ADMIN_PASSWORD: ${MERCHANT_ADMIN_PASSWORD:-}
      MERCHANT_SECURE_COOKIES: ${MERCHANT_SECURE_COOKIES:-true}
      MERCHANT_PUBLIC_ORIGIN: ${MERCHANT_PUBLIC_ORIGIN:-}
      MERCHANT_TRUST_PROXY: "true"
      MAGIC_VIDEO_VENDOR_KEY: ${MAGIC_VIDEO_VENDOR_KEY:-}
    networks:
      - default
      - merchant-db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-merchant}
      POSTGRES_DB: ${POSTGRES_DB:-merchant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请通过 restart.sh 初始化 PostgreSQL 配置}
    volumes:
      - merchant-postgres-data:/var/lib/postgresql
    networks:
      - merchant-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  merchant-postgres-data:

networks:
  merchant-db:
    internal: true

  design-pages:
    external: true
    name: design_default

  account-pages:
    external: true
    name: sub2api-deploy_sub2api-network
