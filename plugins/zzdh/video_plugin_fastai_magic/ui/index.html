<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FastAiApi 魔法视频</title><style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;color:#e5eaf5;background:#191d28}body{margin:0;padding:22px}h1{font-size:19px;margin:0 0 8px}p{color:#a9b4ca;line-height:1.7}label{display:block;margin:20px 0 7px}input,select,button{box-sizing:border-box;width:100%;border:1px solid #414b61;border-radius:8px;background:#242b3b;color:inherit;padding:11px;font:inherit}button{cursor:pointer;background:#28577f;margin-top:14px}button:disabled{opacity:.6}input:focus,select:focus,button:focus-visible{outline:2px solid #6dd9d0;outline-offset:2px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.details{white-space:pre-line;padding:14px;background:#222a3b;border-radius:9px;color:#b7c4d9;line-height:1.8;overflow-wrap:anywhere}.status{min-height:1.6em;color:#8cddd4}small{color:#a9b4ca}a{color:#8cddd4}@media(max-width:400px){body{padding:15px}.row{grid-template-columns:1fr}}
</style></head><body><h1>FastAiApi 魔法视频</h1><p>接口地址已内置，只需填写 tumeiapi.com 的魔法视频分组 Key。</p>
<label for="key">API Key</label><input id="key" type="password" autocomplete="new-password" placeholder="sk-…"><button id="test" type="button">测试连接</button><p id="status" class="status" role="status"></p>
<label for="model">视频模型</label><select id="model"></select><img id="model-icon" src="assets/jimeng.svg" width="36" height="36" alt="所选模型图标"><p id="details" class="details"></p>
<div class="row"><div><label for="resolution">分辨率</label><select id="resolution"></select></div><div><label for="ratio">画幅比例</label><select id="ratio"></select></div></div>
<div class="row"><div><label for="duration">时长（秒）</label><input id="duration" type="number" step="1" min="4" max="10" value="4"></div><div><label for="duration_source">时长来源</label><select id="duration_source"><option value="plugin">插件设置</option><option value="scene">分镜时长</option></select></div></div>
<label for="generation_mode">生成方式</label><select id="generation_mode"><option>文生视频</option><option>参考生视频</option><option>首尾帧</option></select>
<p><small>本地素材自动上传，单个文件上限 10MB。每 20 秒查询，超时保留任务记录；重新运行会继续原任务。结果请及时保存。</small></p><a href="https://fastaiapi.cloud/help/magic-video/" target="_blank" rel="noopener noreferrer">查看接入与插件文档 ↗</a>
<script src="../../../plugin-sdk.js"></script><script src="app.js"></script></body></html>
