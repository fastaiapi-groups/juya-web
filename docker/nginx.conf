server {
    listen 80;
    server_name ui.fastaiapi.cloud;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    sendfile on;
    tcp_nopush on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /site-config.json {
        alias /etc/fastai/site.json;
        default_type application/json;
        add_header Cache-Control 'no-store';
        add_header X-Content-Type-Options nosniff always;
    }

    # Expose installers only; folders, manifests, databases and other files stay private.
    location ~ ^/downloads/([^/]+\.(?:exe|dmg|zip|AppImage|deb|rpm))$ {
        alias /srv/downloads/$1;
        disable_symlinks on;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment';
        add_header Cache-Control 'no-cache';
        add_header X-Content-Type-Options nosniff always;
    }

    location /downloads/ { return 404; }
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control 'no-cache';
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
