map_hash_bucket_size 128;
# Translate only exact same-origin requests at the published aliases.
# Foreign origins remain unchanged and are rejected by the existing backends.
map "$host|$http_origin" $website_update_origin {
    default $http_origin;
    "tumeiapi.com|https://tumeiapi.com" https://fastaiapi.cloud;
    "api.fastaiapi.cloud|http://8.137.194.180:90" https://fastaiapi.cloud;
}
map "$host|$http_origin" $website_merchant_origin {
    default $http_origin;
    "fastaiapi.cloud|https://fastaiapi.cloud" https://home.fastaiapi.cloud;
    "www.fastaiapi.cloud|https://www.fastaiapi.cloud" https://home.fastaiapi.cloud;
    "tumeiapi.com|https://tumeiapi.com" https://home.fastaiapi.cloud;
    "api.fastaiapi.cloud|http://8.137.194.180:90" https://home.fastaiapi.cloud;
}
map "$host|$http_origin" $website_cookie_secure {
    default secure;
    "api.fastaiapi.cloud|http://8.137.194.180:90" nosecure;
}
map $uri $website_api_uri {
    ~^/fastaiapi/(?:api/)?manju-updates/(.*)$ /$1;
    ~^/fastaiapi/(.*)$ /$1;
    default $uri;
}
server {
    listen 80;
    server_name home.fastaiapi.cloud;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    sendfile on;
    tcp_nopush on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $design_backend design-api:8080;
    set $updates_backend manju-updates-api:8080;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /site-config.json {
        alias /etc/fastai/site.json;
        default_type application/json;
        add_header Cache-Control 'no-store';
        add_header X-Content-Type-Options nosniff always;
    }

    location = /fastaiui { return 302 /fastaiui/; }
    location /fastaiui/assets/ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }
    location /fastaiui/ {
        try_files $uri $uri/ /fastaiui/index.html;
        add_header Cache-Control 'no-store' always;
    }
    location = /fastaiapi/downloads/codexplus { return 302 /fastaiui/downloads/codexplus; }
    location ~ ^/fastaiapi/(?:api/)?manju-updates/ {
        proxy_pass http://$updates_backend$website_api_uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header Origin $website_update_origin;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 2048m;
    }
    location /fastaiapi/ {
        proxy_pass http://$design_backend$website_api_uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 2048m;
    }

    location ^~ /api/ {
        proxy_pass http://merchant:3000;
        proxy_http_version 1.1;
        proxy_set_header Host home.fastaiapi.cloud;
        proxy_set_header Origin $website_merchant_origin;
        proxy_cookie_flags merchant_session $website_cookie_secure;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        client_max_body_size 32k;
        add_header Cache-Control 'no-store' always;
        add_header X-Content-Type-Options nosniff always;
    }

    # 魔法视频文档的本地素材上传与服务端查询缓存，密钥只在请求头中传递。
    location = /help/magic-video/assets {
        proxy_pass http://merchant:3000/api/magic-video/assets;
        client_max_body_size 10m;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
    }
    location ^~ /help/magic-video/bridge/ {
        proxy_pass http://merchant:3000/api/magic-video/bridge/;
        client_max_body_size 1m;
        proxy_read_timeout 250s;
    }

    location /merchant/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control 'no-store' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Expose installers only; folders, manifests, databases and other files stay private.
    location ~ ^/downloads/([^/]+\.(?:exe|dmg|zip|AppImage|deb|rpm))$ {
        alias /srv/downloads/$1;
        disable_symlinks on;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment';
        add_header Cache-Control 'no-cache';
        add_header X-Content-Type-Options nosniff always;
    }

    location /downloads/ { return 404; }
    location ~ /\. { return 404; }

    # 公开教程允许桌面客户端嵌入；其他页面继续限制为同源。
    location = /help/codex/ {
        try_files /help/codex/index.html =404;
        add_header Cache-Control 'no-cache';
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'self' tauri://localhost http://tauri.localhost https://tauri.localhost http://localhost:1420 http://127.0.0.1:1420" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control 'no-cache';
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
